# KL-141 — Klarim Security Gate: config do dogfooding no CI/CD da própria Klarim.
# Scanner de EXPOSIÇÃO/configuração pós-deploy (não é DAST). Ver security_gate/ + scripts/security_gate.py.
target: https://klarim.net
fail_on: critical
timeout: 60

checks:
  headers:
    enabled: true
    hsts_min_age: 31536000        # 1 ano
  ssl:
    enabled: true
    min_days: 14                  # avisa (HIGH) se expira em ≤14 dias; ≤7 é CRÍTICO
  exposure:
    enabled: true
    # Allowlist — falsos positivos de SPA (o Astro/Vite devolve 200 p/ paths inexistentes fora do
    # blocklist do nginx, KL-138). Os recursos NÃO-HTML (source maps, .json/.sql/.env/.yml/.config)
    # já são resolvidos automaticamente pelo Content-Type guard do check (não precisam de allowlist);
    # aqui ficam só os paths HTML-capazes (painéis/UI/debug), onde o Content-Type não desambigua.
    allowlist:
      - /docs          # UI de docs (FastAPI off em prod; o SPA devolve HTML 200)
      - /adminer       # fallback de SPA, não é painel real
      - /cpanel        # fallback de SPA
      - /_profiler     # fallback de SPA
      - /elmah.axd     # fallback de SPA (.axd real seria HTML → não usa o guard)
      - /trace.axd     # fallback de SPA
    extra_paths: []
  credentials:
    enabled: true
  api:
    enabled: true
    root_path: /api/
    protected_endpoints:
      - /api/admin/
      - /api/account/
      - /api/system/
      - /mcp/

  # KL-149 — 13 checks novos. Todos passivos (GET/HEAD/DNS; rate_limit = mini-burst de 10).
  # Habilitados por default; ponha `enabled: false` p/ desligar um. Ver security_gate/checks/.
  cors: {enabled: true}                 # reflexão de Origin arbitrário (CRITICAL)
  cookies: {enabled: true}              # HttpOnly/Secure/SameSite nos cookies de sessão
  https_redirect: {enabled: true}       # HTTP → HTTPS (CRITICAL)
  open_redirect: {enabled: true}        # redirect p/ domínio externo via ?redirect=/?next=…
  error_disclosure: {enabled: true}     # stack trace / caminho interno em página de erro
  jwt: {enabled: true}                  # alg=none / sem exp / PII no payload (NUNCA forja token)
  form_security: {enabled: true}        # <form action> p/ domínio externo (CRITICAL)
  dns: {enabled: true}                  # DNSSEC + CAA
  email_security: {enabled: true}       # KL-154 — SPF/DKIM/DMARC (importado do scanner; só DNS TXT)
  dependencies: {enabled: true}         # libs JS com CVE conhecida (base local, sem API externa)
  tls_ciphers: {enabled: true}          # cipher suites fracas (RC4/DES/3DES/NULL) (CRITICAL)
  subdomain: {enabled: true}            # subdomain takeover (CNAME p/ PaaS desativado)
  infrastructure: {enabled: true}       # URLs de backend/PaaS/localhost/IP privado hardcoded no JS
  rate_limit:
    enabled: true
    endpoints:                          # onde o mini-burst de 10 requests procura o 429
      - /
      - /api/

notifications:                    # usadas no Prompt 4 (e-mail/webhook)
  email:
    enabled: true
    recipients:
      - seguranca@klarim.net
    on: failure
  webhook:
    enabled: false
